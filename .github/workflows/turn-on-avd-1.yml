name: Deploy file to AVD

on:
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths: ['files/**']       # also runs when anything in files/ changes

permissions:
  id-token: write             # needed for OIDC login to Azure
  contents: read

env:
  RESOURCE_GROUP: RG-Test
  VM_NAME: avd-1
  SOURCE_FILE: files/hello.txt
  TARGET_DIR: C:\appl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start the VM
        run: az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"
